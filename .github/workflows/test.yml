name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 已 EOL，新 runner 上不再预装，钉到 22.04
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          # 这个工具的主要使用者多在 Windows 上
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 自检（不联网，验证参照数据与判定规则）
        run: python modelcheck.py self-test
      - name: 端到端测试（本地假端点，不需要密钥）
        run: python -m unittest discover -s tests -v

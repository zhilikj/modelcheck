name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 自检（不联网，验证参照数据与判定规则）
        run: python modelcheck.py self-test
      - name: 端到端测试（本地假端点，不需要密钥）
        run: python -m unittest discover -s tests -v
